[package]
name = "botracers-race-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
avian2d = "0.6"
bevy = { version = "0.18", default-features = false, features = ["default_app"] }
serde = { version = "1", features = ["derive"] }
